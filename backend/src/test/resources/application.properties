spring.application.name=rideease-backend-test

# Use in-memory H2 database for unit and slice testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=A_VERY_SECURE_RIDE_EASE_DEFAULT_DEVELOPMENT_SECRET_KEY_32_CHARS!
jwt.expiration-ms=86400000

fare.base.mini=30.0
fare.base.sedan=50.0
fare.base.suv=80.0
fare.per-km.mini=10.0
fare.per-km.sedan=14.0
fare.per-km.suv=18.0
fare.per-min=2.0

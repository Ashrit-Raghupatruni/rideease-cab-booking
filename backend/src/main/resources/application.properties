spring.application.name=rideease-backend

# Port Configuration
server.port=${PORT:8080}
port.driver=${DRIVER_PORT:8081}
port.admin=${ADMIN_PORT:8082}

# MySQL / Relational Database Configuration with In-Memory H2 Fallback
# When MySQL is available (e.g. localhost:3306), configure SPRING_DATASOURCE_URL or use default MySQL URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rideease_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# JWT Configuration
jwt.secret=${JWT_SECRET:A_VERY_SECURE_RIDE_EASE_DEFAULT_DEVELOPMENT_SECRET_KEY_32_CHARS!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL:}

# Mappls Platform API Configuration
mappls.api-key=${MAPPLS_API_KEY:}
mappls.client-id=${MAPPLS_CLIENT_ID:}
mappls.client-secret=${MAPPLS_CLIENT_SECRET:}

# Administrator Initializer
admin.initial.email=${ADMIN_INITIAL_EMAIL:admin@rideease.com}
admin.initial.password=${ADMIN_INITIAL_PASSWORD:admin123}

# Fare Matrix Defaults (INR Currency)
fare.base.mini=30.0
fare.base.sedan=50.0
fare.base.suv=80.0
fare.per-km.mini=10.0
fare.per-km.sedan=14.0
fare.per-km.suv=18.0
fare.per-min=2.0

spring.application.name=rideease-backend

# Port Configuration
server.port=${PORT:8080}
port.driver=${DRIVER_PORT:8081}
port.admin=${ADMIN_PORT:8082}

# MongoDB Atlas Configuration (Must be provided via environment variable or local .env)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/rideease_db}}
spring.data.mongodb.auto-index-creation=false

# JWT Configuration (Must be provided via environment variable or local .env)
jwt.secret=${JWT_SECRET:A_VERY_SECURE_RIDE_EASE_DEFAULT_DEVELOPMENT_SECRET_KEY_32_CHARS!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL:}

# Mappls Platform API Configuration
mappls.api-key=${MAPPLS_API_KEY:}
mappls.client-id=${MAPPLS_CLIENT_ID:}
mappls.client-secret=${MAPPLS_CLIENT_SECRET:}

# Administrator Initializer
admin.initial.email=${ADMIN_INITIAL_EMAIL:}
admin.initial.password=${ADMIN_INITIAL_PASSWORD:}

# Fare Matrix Defaults (INR Currency)
fare.base.mini=30.0
fare.base.sedan=50.0
fare.base.suv=80.0
fare.per-km.mini=10.0
fare.per-km.sedan=14.0
fare.per-km.suv=18.0
fare.per-min=2.0

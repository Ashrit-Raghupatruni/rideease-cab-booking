<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Account Settings — RideEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/toury.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-gradient-driver navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/driver/dashboard}">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
            <span class="text-white small">Driver Settings (Port 8081)</span>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 580px;">
        <div class="toury-card p-4 mb-4">
            <h1 class="h4 fw-bold text-dark mb-4">Captain Profile & Settings</h1>

            <!-- Driver Info Summary -->
            <div class="d-flex align-items-center gap-3 p-3 bg-light rounded-3 mb-4">
                <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 54px; height: 54px; font-size: 1.5rem;">
                    <i class="bi bi-speedometer2"></i>
                </div>
                <div>
                    <h2 class="h5 fw-bold mb-0" th:text="${driverUser.name}">Ramesh Kumar</h2>
                    <div class="text-muted small" th:text="${driverUser.email}">driver@example.com</div>
                    <div class="text-muted small" th:text="${driverUser.phone}">+91 98765 12345</div>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="list-group mb-4">
                <a th:href="@{/driver/payments}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                    <div>
                        <i class="bi bi-wallet2 text-success me-2"></i>
                        <span class="fw-semibold">Earnings & Settlement History</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted"></i>
                </a>
            </div>

            <!-- Logout Section -->
            <div class="mb-4">
                <a th:href="@{/auth/logout(type='driver')}" class="btn btn-outline-secondary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i> Log Out from Driver Hub
                </a>
            </div>

            <!-- Dangerous Action: Delete Driver Account -->
            <div class="p-3 border border-danger border-opacity-25 rounded-3 bg-danger-subtle">
                <h3 class="h6 fw-bold text-danger mb-1">Danger Zone</h3>
                <p class="small text-danger mb-3">Permanently delete your driver partner account from MongoDB.</p>
                
                <form th:action="@{/driver/account/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete your driver partner account?');">
                    <button type="submit" class="btn btn-danger btn-sm fw-bold">
                        <i class="bi bi-trash3-fill me-1"></i> Delete Driver Account
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>

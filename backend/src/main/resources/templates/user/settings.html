<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings — RideEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/toury.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-gradient-toury navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/user/home}">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
            <span class="text-white small">Account Settings</span>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 580px;">
        <div class="toury-card p-4 mb-4">
            <h1 class="h4 fw-bold text-dark mb-4">User Profile & Settings</h1>

            <!-- User Info Summary -->
            <div class="d-flex align-items-center gap-3 p-3 bg-light rounded-3 mb-4">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 54px; height: 54px; font-size: 1.5rem;">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div>
                    <h2 class="h5 fw-bold mb-0" th:text="${user.name}">Rahul Sharma</h2>
                    <div class="text-muted small" th:text="${user.email}">rahul@example.com</div>
                    <div class="text-muted small" th:text="${user.phone}">+91 98765 43210</div>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="list-group mb-4">
                <a th:href="@{/user/rides}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                    <div>
                        <i class="bi bi-clock-history text-primary me-2"></i>
                        <span class="fw-semibold">My Rides & Trip History</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted"></i>
                </a>
                <a th:href="@{/user/payments}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                    <div>
                        <i class="bi bi-credit-card text-success me-2"></i>
                        <span class="fw-semibold">Payment History & Transactions</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted"></i>
                </a>
            </div>

            <!-- Logout Section -->
            <div class="mb-4">
                <a th:href="@{/auth/logout(type='user')}" class="btn btn-outline-secondary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i> Log Out of Account
                </a>
            </div>

            <!-- Dangerous Action: Delete Account -->
            <div class="p-3 border border-danger border-opacity-25 rounded-3 bg-danger-subtle">
                <h3 class="h6 fw-bold text-danger mb-1">Danger Zone</h3>
                <p class="small text-danger mb-3">Permanently delete your passenger account and all associated profile data from MongoDB.</p>
                
                <form th:action="@{/user/account/delete}" method="post" onsubmit="return confirm('Are you sure you want to permanently delete your account? This action cannot be undone.');">
                    <button type="submit" class="btn btn-danger btn-sm fw-bold">
                        <i class="bi bi-trash3-fill me-1"></i> Delete My Account
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>

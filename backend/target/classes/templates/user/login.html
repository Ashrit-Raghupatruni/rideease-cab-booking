<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Sign In — RideEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/toury.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 440px;">
        <div class="toury-card p-4 p-md-5 shadow-sm border-0">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                    <i class="bi bi-car-front-fill fs-2"></i>
                </div>
                <h1 class="h3 fw-bold text-dark">Welcome Rider!</h1>
                <p class="text-muted small">Sign in to book cabs and track live trips (Port 8080)</p>
            </div>

            <!-- Error Notification -->
            <div th:if="${error}" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/user/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control form-control-lg fs-6" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control form-control-lg fs-6" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-toury w-100 py-3 fw-bold">Sign In to RideEase</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">Don't have an account? 
                    <a th:href="@{/user/signup}" class="text-primary fw-bold text-decoration-none">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>

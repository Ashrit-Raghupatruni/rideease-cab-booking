<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History — RideEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/toury.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-gradient-toury navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/user/home}">
                <i class="bi bi-arrow-left"></i> Home
            </a>
            <span class="text-white small">Payment History</span>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 720px;">
        <div class="toury-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h4 fw-bold text-dark mb-0">Payments & Receipts</h1>
                    <p class="text-muted small mb-0">Itemized history of all completed and pending trip payments</p>
                </div>
                <div class="text-end">
                    <small class="text-muted d-block">Total Spent:</small>
                    <span class="h4 fw-bold text-primary mb-0" th:text="'₹' + ${totalSpent}">₹0.00</span>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5 text-muted">
                <i class="bi bi-credit-card fs-1"></i>
                <p class="mt-2">No payment transactions found.</p>
            </div>

            <div th:unless="${#lists.isEmpty(bookings)}" class="list-group list-group-flush">
                <div th:each="b : ${bookings}" class="list-group-item px-0 py-3 border-bottom d-flex justify-content-between align-items-center">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge" 
                                  th:classappend="${b.paymentStatus.name() == 'PAID' ? 'bg-success' : 'bg-warning text-dark'}"
                                  th:text="${b.paymentStatus}">PAID</span>
                            <strong class="text-dark" th:text="${b.vehicleCategory} + ' Ride'">SEDAN Ride</strong>
                        </div>
                        <div class="small text-muted" th:text="${b.pickupAddress} + ' ➔ ' + ${b.dropoffAddress}">Route</div>
                        <div class="small text-secondary" th:text="'Method: ' + ${b.paymentMethod}">Method: CASH</div>
                    </div>
                    <div class="text-end">
                        <div class="h5 fw-bold text-dark mb-0" th:text="'₹' + ${b.estimatedFare}">₹213.00</div>
                        <small class="text-muted" th:text="${b.status}">COMPLETED</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

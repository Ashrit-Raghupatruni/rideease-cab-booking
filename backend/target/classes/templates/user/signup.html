<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Passenger Account — RideEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/toury.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 460px;">
        <div class="toury-card p-4 p-md-5 shadow-sm border-0">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                    <i class="bi bi-person-plus-fill fs-2"></i>
                </div>
                <h1 class="h3 fw-bold text-dark">Create Account</h1>
                <p class="text-muted small">Register as Passenger on RideEase (Port 8080)</p>
            </div>

            <!-- Error Notification -->
            <div th:if="${error}" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/user/signup}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Rahul Sharma" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="rahul@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Phone Number</label>
                    <input type="tel" name="phone" class="form-control" placeholder="+91 98765 43210" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a secure password" required>
                </div>

                <button type="submit" class="btn btn-toury w-100 py-3 fw-bold">Sign Up as Passenger</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">Already have an account? 
                    <a th:href="@{/user/login}" class="text-primary fw-bold text-decoration-none">Log In</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>

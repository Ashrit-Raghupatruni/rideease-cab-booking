<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Settlement History — RideEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/toury.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-gradient-driver navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/driver/dashboard}">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>
            <span class="text-white small">Earnings & Settlements (Port 8081)</span>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 720px;">
        <div class="toury-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h4 fw-bold text-dark mb-0">Driver Earnings & Payout Ledger</h1>
                    <p class="text-muted small mb-0">Record of fares collected and completed trip payouts</p>
                </div>
                <div class="text-end">
                    <small class="text-muted d-block">Lifetime Earnings:</small>
                    <span class="h4 fw-bold text-success mb-0" th:text="'₹' + ${totalEarned}">₹0.00</span>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(trips)}" class="text-center py-5 text-muted">
                <i class="bi bi-wallet2 fs-1"></i>
                <p class="mt-2">No completed trips found yet.</p>
            </div>

            <div th:unless="${#lists.isEmpty(trips)}" class="list-group list-group-flush">
                <div th:each="t : ${trips}" class="list-group-item px-0 py-3 border-bottom d-flex justify-content-between align-items-center">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge" 
                                  th:classappend="${t.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${t.status}">COMPLETED</span>
                            <strong class="text-dark" th:text="${t.pickupAddress} + ' ➔ ' + ${t.dropoffAddress}">Route</strong>
                        </div>
                        <div class="small text-secondary" th:text="'Passenger OTP Verified: ' + ${t.otp}">OTP: 8492</div>
                        <div class="small text-muted" th:text="'Mode: ' + ${t.paymentMethod}">Payment: CASH</div>
                    </div>
                    <div class="text-end">
                        <div class="h5 fw-bold text-success mb-0" th:text="'₹' + ${t.estimatedFare}">₹213.00</div>
                        <span class="badge bg-light text-dark border" th:text="${t.paymentStatus}">PAID</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Partner Registration — RideEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/toury.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 480px;">
        <div class="toury-card p-4 p-md-5 shadow-sm border-0 border-top border-4 border-success">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-2">
                    <i class="bi bi-person-badge-fill fs-2"></i>
                </div>
                <h1 class="h3 fw-bold text-dark">Driver Onboarding</h1>
                <p class="text-muted small">Register to drive on RideEase (Port 8081)</p>
            </div>

            <!-- Error Notification -->
            <div th:if="${error}" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/driver/signup}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Ramesh Kumar" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Driver Email</label>
                    <input type="email" name="email" class="form-control" placeholder="ramesh.driver@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Mobile Phone</label>
                    <input type="tel" name="phone" class="form-control" placeholder="+91 98765 12345" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Account Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create password" required>
                </div>

                <button type="submit" class="btn btn-driver w-100 py-3 fw-bold">Register as Driver</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">Already registered? 
                    <a th:href="@{/driver/login}" class="text-success fw-bold text-decoration-none">Sign In</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>

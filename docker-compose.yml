version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rideease-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rideease_db
    volumes:
      - mongo-data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rideease-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/rideease_db
      JWT_SECRET: ${JWT_SECRET:-A_VERY_SECURE_RIDE_EASE_DEFAULT_DEVELOPMENT_SECRET_KEY_32_CHARS!}
      JWT_EXPIRATION_MS: 86400000
      PORT: 8080
      DRIVER_PORT: 8081
      ADMIN_PORT: 8082
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@rideease.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-AdminSecure2026!}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:

version: '3.8'

services:
  # MySQL 8.0 Relational Database Service
  mysql:
    image: mysql:8.0
    container_name: rideease-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: rideease_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 3.2.5 Multi-Port Web Backend (Ports 8080, 8081, 8082)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rideease-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rideease_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: 86400000
      PORT: 8080
      DRIVER_PORT: 8081
      ADMIN_PORT: 8082
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@rideease.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
